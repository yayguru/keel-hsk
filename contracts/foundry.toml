[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
auto_detect_solc = false
offline = true
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
hsk_testnet = "https://testnet.hsk.xyz"
hsk_mainnet = "https://mainnet.hsk.xyz"
